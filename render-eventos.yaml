# Copia aparte para eventos y clientes: "visuales-interactivas" en Render.
# En Render: New → Blueprint → este repositorio → en "Blueprint Path" escribí render-eventos.yaml.
services:
  - type: web
    name: visuales-interactivas
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeploy: true # cada cambio en GitHub se publica solo
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: START_PRESET # con qué preset arranca la salida
        value: Demo2
      - key: PANEL_PASSWORD # contraseña para entrar al panel (la salida queda pública)
        sync: false
    # Para que las imágenes, animaciones y presets NO se borren al reiniciar hace
    # falta un plan pago con disco. Cambiá "plan: free" por "plan: starter" y
    # sacá los # de estas líneas:
    # disk:
    #   name: datos
    #   mountPath: /var/data
    #   sizeGB: 1
    # y agregá en envVars:
    #   - key: DATA_DIR
    #     value: /var/data
