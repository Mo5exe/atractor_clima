<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Atractor — Salida Visual</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      cursor: crosshair;
    }
    #audioGate {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translateX(-50%);
      padding: 12px 20px;
      border-radius: 999px;
      border: 1px solid #5cc8ff;
      background: rgba(5, 19, 26, 0.85);
      color: #d4f1ff;
      font: 15px "Segoe UI", Roboto, Arial, sans-serif;
      cursor: pointer;
      z-index: 5;
    }
    #audioGate[hidden] { display: none; }
    #qrBox {
      position: fixed;
      right: 16px;
      bottom: 16px;
      padding: 10px 10px 8px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.6);
      color: #e8ecf4;
      font: 13px "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
      pointer-events: none;
      z-index: 4;
    }
    #qrBox[hidden] { display: none; }
    #qrBox img { display: block; width: 140px; height: 140px; margin: 0 auto 6px; border-radius: 4px; background: #fff; }
    #hint {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: #8b93a7;
      font: 14px "Segoe UI", Roboto, Arial, sans-serif;
      text-align: center;
      line-height: 1.6;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <!--
    Salida visual pura: sin controles. Todo llega por sockets desde el panel
    de control (index.html). Pensada para proyectar en la pared.
    - Doble clic: pantalla completa.
    - Clic sostenido + mover el mouse: simula la mano (para probar sin cámara).
  -->
  <canvas id="canvas"></canvas>
  <div id="qrBox" hidden><img id="qrImg" alt="Código QR para sumarse" />📱 Sumate con tu celular</div>
  <div id="hint">Todavía no hay capas.<br>Agregalas desde el panel de control.<br><br>Doble clic: pantalla completa · Clic y arrastrar: simular la mano</div>

  <script src="/socket.io/socket.io.js"></script>
  <button id="audioGate" type="button" hidden></button>
  <script src="js/audio.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/output.js"></script>
  <script type="module" src="js/output-camera.js"></script>
</body>
</html>
